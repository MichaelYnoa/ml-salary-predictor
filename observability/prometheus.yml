# observability/prometheus.yml
# Le dice a Prometheus QUÉ monitorear y CON QUÉ FRECUENCIA.

global:
  scrape_interval: 15s  # recolecta métricas cada 15 segundos

scrape_configs:
  # Prometheus se monitorea a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Tu API de salary predictor
  - job_name: 'salary-api'
    static_configs:
      # En Docker Compose los servicios se comunican por nombre
      # "salary-api" es el nombre del servicio que definiste arriba
      - targets: ['host.docker.internal:8080']