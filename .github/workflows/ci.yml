# .github/workflows/ci.yml
# Este pipeline se ejecuta en cada push a cualquier rama.
# En producción lo limitarías a main o a PRs — por ahora queremos verlo correr.

name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repo en el runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Entrena el modelo para generar los .pkl
      # El runner no tiene los artefactos — hay que generarlos en cada build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      # 3. Login a DockerHub usando los secrets que configuraste
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build y push de la imagen
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/salary-predictor:latest